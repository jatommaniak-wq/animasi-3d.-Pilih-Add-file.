<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDIO ANIMASI SHORTS 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#111;color:#fff}
#top{background:#FF5722;padding:12px;text-align:center;font-weight:bold;position:fixed;top:0;width:100%;z-index:10}
#view{position:fixed;top:45px;left:0;width:100%;height:55vh;background:#87CEEB;display:flex;justify-content:center;align-items:center}
#c{background:#FFF9C4;border:2px solid #333;width:100%;height:100%}
#menu{position:fixed;bottom:0;left:0;width:100%;height:45vh;background:#222;padding:10px;overflow:auto}
select,textarea,input,button{width:100%;padding:12px;margin:4px 0;border-radius:8px;border:0;font-size:14px}
button{background:#2196F3;color:#fff;font-weight:bold} button.rec{background:#E91E63}
.row{display:flex;gap:5px}.row>*{flex:1}
</style>
</head>
<body>
<div id="top">🎬 STUDIO ANIMASI SHORTS - RIAN SMP 14 TH - 60 DETIK 9:16</div>
<div id="view"><canvas id="c" width="360" height="640"></canvas></div>
<div id="menu">
<div class="row">
<select id="kar" onchange="draw()"><option value="rian">Rian SMP 14Th (Biru)</option><option value="sari">Sari Hijab Putih 14Th</option><option value="guru">Bu Guru Batik</option><option value="bos">Bos</option></select>
<select id="lok" onchange="draw()"><option value="sekolah">Lokasi: Kelas SMP</option><option value="desa">Lokasi: Desa</option><option value="rumah">Lokasi: Rumah</option><option value="kantor">Lokasi: Kantor</option></select>
</div>
<div style="background:#333;padding:5px;border-radius:6px">Adegan <span id="jml">1</span>/6 - Edit dialog di bawah:</div>
<textarea id="dlg" rows="3">Bu Guru: 5+5 berapa Rian?
Rian: Otak lowbat Bu, butuh seblak!
Sari: Ya Allah Rian...
Bu Guru: Ya sudah, PR seblak!</textarea>
<div class="row">
<button onclick="play()">▶ Play Cerita + Suara</button>
<button onclick="jalanAnim()">Jalan</button>
<button onclick="lambaiAnim()">Lambaikan</button>
<button onclick="stopAnim()">Berhenti</button>
</div>
<button class="rec" onclick="rekam()">🔴 REKAM VIDEO MP4 60 DETIK - HASIL 9:16</button>
<p style="font-size:11px;color:#aaa;text-align:center">Versi 2D ini PASTI muncul, bisa rekam jadi video Shorts!</p>
</div>
<script>
let canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let x=180, walk=false, lambai=false, frame=0;

function draw(){
let kar=document.getElementById('kar').value;
let lok=document.getElementById('lok').value;
ctx.clearRect(0,0,360,640);
// Background lokasi
if(lok=='sekolah'){ctx.fillStyle='#FFF9C4'; ctx.fillRect(0,0,360,640); ctx.fillStyle='#8D6E63'; ctx.fillRect(0,450,360,50); ctx.fillStyle='#fff'; ctx.fillRect(20,20,320,80); ctx.fillStyle='#000'; ctx.font='20px Arial'; ctx.fillText('PAPAN TULIS: 5+5=?',30,60);}
else if(lok=='desa'){ctx.fillStyle='#87CEEB'; ctx.fillRect(0,0,360,400); ctx.fillStyle='#4CAF50'; ctx.fillRect(0,400,360,240);}
else{ctx.fillStyle='#FFE0B2'; ctx.fillRect(0,0,360,640);}

// Karakter
let color='#2196F3'; if(kar=='sari') color='#E91E63'; if(kar=='guru') color='#795548'; if(kar=='bos') color='#212121';
ctx.save(); ctx.translate(x, 350);
// Bayangan
ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,110,30,10,0,0,6.28); ctx.fill();
// Kaki
ctx.fillStyle='#0D47A1'; ctx.fillRect(-15+Math.sin(frame*0.3)*5, 50, 12, 40); ctx.fillRect(5-Math.sin(frame*0.3)*5, 50, 12, 40);
// Badan
ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(-25, -10, 50, 60, 15); ctx.fill();
// Kepala
ctx.fillStyle='#FFDBAC'; ctx.beginPath(); ctx.arc(0, -30, 25, 0, 6.28); ctx.fill();
// Hijab
if(kar=='sari'){ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(0, -30, 28, 3.5, 2.8); ctx.fill();}
// Tangan
ctx.fillStyle=color; let ang=lambai? Math.sin(frame*0.5)*1.5 : 0;
ctx.save(); ctx.translate(-25,0); ctx.rotate(ang); ctx.fillRect(-10,-5,20,35); ctx.restore();
ctx.fillRect(15,0,20,35);
// Muka
ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-8,-28,2,0,6.28); ctx.arc(8,-28,2,0,6.28); ctx.fill();
ctx.restore();
// Nama
ctx.fillStyle='#000'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText(kar.toUpperCase()+' - 14 TH SMP',180,500);
}

function anim(){frame++; if(walk){x+=2; if(x>330) x=30;} draw(); requestAnimationFrame(anim);}
anim();
function jalanAnim(){walk=true; lambai=false} function stopAnim(){walk=false; lambai=false} function lambaiAnim(){lambai=true; walk=false}
function ucap(t){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t); u.lang='id-ID'; u.rate=0.95; speechSynthesis.speak(u);}}
function play(){
let teks=document.getElementById('dlg').value;
let lines=teks.split('\n');
let i=0; function nxt(){if(i>=lines.length) return; ucap(lines[i]); document.getElementById('kar').value=lines[i].toLowerCase().includes('sari')?'sari':lines[i].toLowerCase().includes('guru')?'guru':'rian'; jalanAnim(); if(lines[i].toLowerCase().includes('otak lowbat')) lambaiAnim(); i++; setTimeout(nxt,3500);} nxt();
}
function rekam(){
let stream=canvas.captureStream(30); let rec=new MediaRecorder(stream,{mimeType:'video/webm'}); let ch=[];
rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=()=>{let blob=new Blob(ch,{type:'video/webm'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='SHORTS-GURU-SMP-14TH-60detik-9x16.webm'; a.click(); alert('VIDEO SELESAI! Cek Download! Siap upload YouTube Shorts!');};
rec.start(); play(); setTimeout(()=>rec.stop(),60000); alert('MEREKAM 60 DETIK! Jangan tutup HP! Suara + Gerakan jalan!');
}
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDIO 3D LITE</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}#top{background:#FF5722;padding:10px;text-align:center;font-weight:900}#c{width:100%;height:65vh;display:block;background:#222}#menu{padding:8px;background:#1a1a1a}select,input,textarea,button{width:100%;padding:8px;margin:3px 0;border-radius:6px;border:none}button{font-weight:900;color:#fff} .row{display:flex;gap:4px}.row>*{flex:1}</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="top">🎬 STUDIO ANIMASI SHORTS - 3D LITE (FIX HP)</div>
<canvas id="c"></canvas>
<div id="menu">
<div class="row"><select id="kar"><option value="oren">AKU Oren</option><option value="emak">EMAK</option><option value="alek">ALEK</option><option value="ketua">KETUA</option></select><select id="aksi"><option value="idle">Idle</option><option value="marah">Marah</option><option value="takut">Takut</option></select></div>
<input id="judul" value="POV: ada tamu pas lagi sendiri dirumah">
<textarea id="dialog" rows="2">aku: waduh ada tamu...
tamu: assalamualaikum, emak ada?</textarea>
<div class="row"><button onclick="render()" style="background:#2196F3">🔄 RENDER 3D</button><button onclick="location.reload()" style="background:#4CAF50">RELOAD</button></div>
</div>
<script>
let scene, camera, renderer, cat;
function init(){
 scene = new THREE.Scene(); scene.background = new THREE.Color(0xFFF9C4);
 camera = new THREE.PerspectiveCamera(50, window.innerWidth/(window.innerHeight*0.65), 0.1, 100); camera.position.set(0,1,3);
 renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true}); renderer.setSize(window.innerWidth, window.innerHeight*0.65);
 const light = new THREE.DirectionalLight(0xffffff,1); light.position.set(2,3,2); scene.add(light); scene.add(new THREE.AmbientLight(0xffffff,0.7));
 render();
}
function render(){
 if(cat) scene.remove(cat);
 const kar=document.getElementById('kar').value; const aksi=document.getElementById('aksi').value;
 cat = new THREE.Group();
 let col=0xffa500; if(kar=='emak') col=0xffffff; if(kar=='alek') col=0x999999; if(kar=='ketua') col=0x333333;
 const mat = new THREE.MeshStandardMaterial({color:col});
 const body = new THREE.Mesh(new THREE.SphereGeometry(0.4,16,16), mat); body.position.y=0.6; body.scale.y=1.3; cat.add(body);
 const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), mat); head.position.y=1.3; cat.add(head);
 const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), new THREE.MeshStandardMaterial({color:0x000000})); eye.position.set(-0.15,1.35,0.3); cat.add(eye);
 const eye2=eye.clone(); eye2.position.x=0.15; cat.add(eye2);
 if(aksi=='marah'){cat.scale.set(1.3,1.3,1.3); cat.rotation.x=0.2;} if(aksi=='takut'){cat.position.y=-0.3;}
 scene.add(cat); renderer.render(scene,camera);
}
init();
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth, window.innerHeight*0.65); render();});
</script>
</body>
</html>

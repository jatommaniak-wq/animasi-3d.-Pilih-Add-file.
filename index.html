
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animasi 3D Cartoon</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #101c35;
  font-family: Arial, sans-serif;
}
#scene { width: 100vw; height: 100vh; }
.panel {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 5;
}
button {
  border: 0;
  border-radius: 25px;
  padding: 12px 18px;
  color: white;
  background: #2468d8;
  font-weight: bold;
}
h3 {
  position: fixed;
  top: 10px;
  width: 100%;
  text-align: center;
  color: white;
  z-index: 5;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<h3>MY 3D CARTOON WORLD</h3>
<div id="scene"></div>

<div class="panel">
  <button id="walk">Jalan</button>
  <button id="wave">Melambaikan Tangan</button>
  <button id="stop">Berhenti</button>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from
"three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd9ff);
scene.fog = new THREE.Fog(0x9bd9ff, 12, 30);

const camera = new THREE.PerspectiveCamera(
  45, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(4, 3.5, 8);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById("scene").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.5, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7d9e, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x78bd70 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const mat = (color, roughness = 0.8) =>
  new THREE.MeshStandardMaterial({ color, roughness });

const skin = mat(0xffbd91);
const shirt = mat(0x287be5);
const pants = mat(0x243d69);
const hair = mat(0x38251d);
const shoe = mat(0x292b35);
const white = mat(0xffffff);
const black = mat(0x17151b);

function sphere(parent, name, pos, scale, material) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 24),
    material
  );
  mesh.name = name;
  mesh.position.set(...pos);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function limb(parent, pos, length, radius, material) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 20),
    material
  );
  mesh.position.set(...pos);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// Character
const character = new THREE.Group();
scene.add(character);

const body = new THREE.Group();
character.add(body);

// Torso
sphere(body, "body", [0, 1.45, 0], [.48, .65, .3], shirt);

// Neck
sphere(body, "neck", [0, 2.05, 0], [.19, .23, .19], skin);

// Head
const head = new THREE.Group();
head.position.set(0, 2.55, 0);
body.add(head);

sphere(head, "face", [0, 0, 0], [.57, .65, .49], skin);

// Hair cap
sphere(head, "hair", [0, .42, -.03], [.59, .32, .52], hair);
sphere(head, "bang", [0, .27, .39], [.38, .20, .17], hair);

// Ears
sphere(head, "earL", [-.56, -.05, 0], [.13, .19, .12], skin);
sphere(head, "earR", [.56, -.05, 0], [.13, .19, .12], skin);

// Eyes
for (const x of [-.21, .21]) {
  sphere(head, "eye", [x, .07, .423], [.125, .17, .075], white);
  sphere(head, "pupil", [x, .06, .49], [.065, .095, .035], black);
  sphere(head, "shine", [x-.02, .105, .52],
    [.025, .03, .015], white);
}

// Nose and smile
sphere(head, "nose", [0, -.10, .49], [.09, .09, .08], skin);

const smile = new THREE.Mesh(
  new THREE.TorusGeometry(.14, .025, 8, 24, Math.PI),
  mat(0x7b3030)
);
smile.position.set(0, -.27, .47);
smile.rotation.z = Math.PI;
head.add(smile);

// Arms
function makeArm(x) {
  const pivot = new THREE.Group();
  pivot.position.set(x, 1.85, 0);
  body.add(pivot);

  sphere(pivot, "shoulder", [0, 0, 0], [.19, .20, .19], shirt);
  limb(pivot, [0, -.32, 0], .48, .115, shirt);
  sphere(pivot, "hand", [0, -.63, 0], [.13, .14, .13], skin);

  return pivot;
}
const leftArm = makeArm(-.53);
const rightArm = makeArm(.53);

// Legs
function makeLeg(x) {
  const pivot = new THREE.Group();
  pivot.position.set(x, .91, 0);
  body.add(pivot);

  limb(pivot, [0, -.32, 0], .65, .16, pants);
  sphere(pivot, "shoe", [0, -.70, .10], [.20, .13, .32], shoe);

  return pivot;
}
const leftLeg = makeLeg(-.23);
const rightLeg = makeLeg(.23);

// Decorative environment
function tree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.12, .17, 1.2, 12),
    mat(0x79502e)
  );
  trunk.position.set(x, .6, z);
  trunk.castShadow = true;
  scene.add(trunk);

  sphere(scene, "tree crown", [x, 1.45, z],
    [.75, .85, .75], mat(0x278b4c));
}
tree(-3, -2);
tree(3, -3);

// Cloud decorations
for (let i = 0; i < 5; i++) {
  sphere(scene, "cloud", [
    -5 + i * 2.5, 4 + (i%2)*.7, -5
  ], [.7, .25, .35], white);
}

// Animation states
let mode = "walk";
let clock = new THREE.Clock();

document.getElementById("walk").onclick = () => mode = "walk";
document.getElementById("wave").onclick = () => mode = "wave";
document.getElementById("stop").onclick = () => mode = "stop";

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  if (mode === "walk") {
    leftLeg.rotation.x = Math.sin(t * 5) * .55;
    rightLeg.rotation.x = -Math.sin(t * 5) * .55;
    leftArm.rotation.x = -Math.sin(t * 5) * .4;
    rightArm.rotation.x = Math.sin(t * 5) * .4;
    body.position.y = Math.abs(Math.sin(t * 5)) * .06;
  }

  if (mode === "wave") {
    leftLeg.rotation.x = 0;
    rightLeg.rotation.x = 0;
    leftArm.rotation.x = 0;
    rightArm.rotation.z = -.3;
    rightArm.rotation.x = Math.sin(t * 8) * .55 - .9;
    body.position.y = Math.sin(t * 3) * .03;
  }

  if (mode === "stop") {
    leftLeg.rotation.x = 0;
    rightLeg.rotation.x = 0;
    leftArm.rotation.x = 0;
    rightArm.rotation.x = 0;
    rightArm.rotation.z = 0;
    body.position.y = 0;
  }

  if (mode !== "wave") {
    rightArm.rotation.z = 0;
  }

  head.rotation.y = Math.sin(t * 1.2) * .08;
  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONON V3 AUTO VIDEO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}
#top{background:#ffcc00;color:#000;padding:10px;text-align:center;font-weight:900;font-size:13px}
#c{width:100%;height:52vh;display:block;background:#111}
#menu{padding:10px;background:#1a1a1a}
textarea,select,button{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:none;font-weight:700}
button{cursor:pointer} .row{display:flex;gap:6px}.row>*{flex:1}
small{color:#ffcc00;font-size:11px;display:block;margin:4px 0}
#progress{width:100%;height:8px;background:#333;border-radius:4px;overflow:hidden;display:none}
#bar{height:100%;width:0%;background:#ffcc00;transition:width 0.2s}
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="top">🎬 KONON V3 - AUTO VIDEO SHORTS (1 KLIK JADI)</div>
<canvas id="c"></canvas>
<div id="progress"><div id="bar"></div></div>
<div id="menu">
<small>NASKAH OTOMATIS (Format: Nama: dialog):</small>
<textarea id="naskah" rows="4">Pak Sobri: Di kampung ini jam 7 pagi semua harus bersin bareng
Bu Tini: Kalau gak ikut bersin gimana Pak?
Pak RT: Malamnya ada yang ketuk pintu 3 kali...
Bocil: Hacchim!! (bersin)</textarea>
<small>TEKS KUNING:</small>
<input id="teks" value="jamnya">
<button onclick="buatVideo()" id="btnVideo" style="background:#ff0000;color:#fff;font-size:16px">🎥 BUAT VIDEO SHORTS OTOMATIS (15 DETIK)</button>
<div class="row">
<button onclick="draw('sobri','biasa')" style="background:#ffcc00;color:#000">Preview</button>
<button onclick="save()" style="background:#444;color:#fff">Save PNG</button>
</div>
<small id="status">Tulis naskah di atas, lalu klik BUAT VIDEO. Nanti otomatis rekam & download.</small>
</div>
<script>
let scene,camera,renderer,group;
function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x121212);
 camera=new THREE.PerspectiveCamera(45, window.innerWidth/(window.innerHeight*0.52),0.1,100); camera.position.set(0,1.1,2.8);
 renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
 renderer.setSize(window.innerWidth, window.innerHeight*0.52);
 scene.add(new THREE.DirectionalLight(0xffffff,1.2).position.set(2,3,2));
 scene.add(new THREE.AmbientLight(0xffffff,0.9));
 draw('sobri','biasa');
}
function txtSprite(t){
 const cv=document.createElement('canvas'); cv.width=512; cv.height=140;
 const ctx=cv.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,512,140);
 ctx.fillStyle='#ffeb3b'; ctx.font='900 52px Arial'; ctx.textAlign='center'; ctx.fillText(t,256,90);
 const tex=new THREE.CanvasTexture(cv); const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex})); spr.scale.set(1.6,0.44,1); spr.position.set(0,-0.15,0.5); return spr;
}
function draw(kar='sobri',mood='biasa',teksCustom){
 if(group) scene.remove(group); group=new THREE.Group();
 const skin=new THREE.MeshStandardMaterial({color:0xFFD6A0}); const baju=new THREE.MeshStandardMaterial({color: kar.includes('tini')?0x6EC6FF:kar.includes('rt')?0x444444:kar.includes('bocil')?0xFF5252:0xA1887F});
 const body=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.85,12),baju); body.position.y=0.45; group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.36,16,16),skin); head.position.y=1.2; group.add(head);
 if(!kar.includes('tini')){ const peci=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.18,16),new THREE.MeshStandardMaterial({color:kar.includes('rt')?0x111111:0x5D4037})); peci.position.y=1.48; group.add(peci); }
 const mata=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,8),new THREE.MeshStandardMaterial({color:0x000})); const m1=mata.clone(); m1.position.set(-0.12,1.25,0.31); group.add(m1); const m2=mata.clone(); m2.position.set(0.12,1.25,0.31); group.add(m2);
 if(mood=='kaget'){ m1.scale.set(1.8,1.8,1.8); m2.scale.set(1.8,1.8,1.8); }
 const t=document.getElementById('teks').value||'Pak Sobri'; group.add(txtSprite(teksCustom||t));
 scene.add(group); renderer.render(scene,camera);
}
function save(){ const a=document.createElement('a'); a.download='konon.png'; a.href=renderer.domElement.toDataURL(); a.click(); }
async function buatVideo(){
 const naskah=document.getElementById('naskah').value.split('\n').filter(x=>x.includes(':'));
 if(naskah.length==0){ alert('Tulis naskah format: Nama: dialog'); return; }
 const btn=document.getElementById('btnVideo'); btn.disabled=true; btn.innerText='⏳ MEREKAM VIDEO...';
 document.getElementById('progress').style.display='block';
 const stream=renderer.domElement.captureStream(30); const recorder=new MediaRecorder(stream,{mimeType:'video/webm'}); const chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data)};
 recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='SHORTS-KONON-'+Date.now()+'.webm'; a.click();
  document.getElementById('status').innerText='✅ Video jadi! File .webm ter-download. Upload langsung ke YouTube Shorts!';
  btn.disabled=false; btn.innerText='🎥 BUAT VIDEO SHORTS OTOMATIS (15 DETIK)'; document.getElementById('progress').style.display='none'; document.getElementById('bar').style.width='0%';
 };
 recorder.start();
 for(let i=0;i<naskah.length;i++){
  const line=naskah[i]; const parts=line.split(':'); const nama=parts[0].toLowerCase(); const dialog=parts.slice(1).join(':');
  let kar='sobri'; if(nama.includes('tini')||nama.includes('bu')) kar='tini'; else if(nama.includes('rt')||nama.includes('roni')) kar='pakrt'; else if(nama.includes('bocil')||nama.includes('joni')) kar='bocil';
  let mood='biasa'; if(dialog.toLowerCase().includes('!')||dialog.toLowerCase().includes('kaget')) mood='kaget'; if(dialog.toLowerCase().includes('takut')||dialog.toLowerCase().includes('ketuk')) mood='takut';
  draw(kar,mood,dialog.substring(0,18));
  document.getElementById('status').innerText=`Merekam ${i+1}/${naskah.length}: ${line}`; document.getElementById('bar').style.width=`${((i+1)/naskah.length)*100}%`;
  await new Promise(r=>setTimeout(r, 2500));
 }
 recorder.stop();
}
init();
window.onresize=()=>{renderer.setSize(window.innerWidth, window.innerHeight*0.52); camera.aspect=window.innerWidth/(window.innerHeight*0.52); camera.updateProjectionMatrix(); draw();};
</script>
</body>
</html>
